<div class="upload-container">
    <h2>Cargar Archivo de Procesos</h2>
    <p>Arrastra y suelta tu archivo (.txt o .csv) o haz clic para buscarlo en tu PC.</p>
    
    <div class="drop-zone" id="dropZone">
        <span class="drop-zone-text">Suelte el archivo aquí o haga clic para cargar</span>
        <input type="file" id="fileInput" accept=".txt,.csv" style="display: none;">
    </div>

    <div class="preview-table-container" id="previewContainer" style="display: none; margin-top: 25px;">
        <h3>Previsualización de Datos Cargados</h3>
        <table class="files-table">
            <thead>
                <tr>
                    <th>Nombre del Proceso</th>
                    <th>Tiempo de Llegada</th>
                    <th>Tiempo de Ejecución</th>
                    <th>Memoria Requerida</th>
                </tr>
            </thead>
            <tbody id="previewTbody"></tbody>
        </table>

        <div style="margin-top: 20px; display: flex; justify-content: flex-end; gap: 10px; align-items: center;">
            <span id="uploadStatus" style="font-size: 13px; color: #4cd3e6;"></span>
            <button class="btn-start" id="btnGuardarArchivo" style="width: auto; padding: 10px 35px;">GUARDAR ARCHIVO</button>
        </div>
    </div>
</div>

<script type="text/javascript" src="/static/js/procesos_subir.js"></script>
